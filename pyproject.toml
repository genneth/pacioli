[project]
name = "pacoli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.1.0",
    "itables>=2.3.0",
    "jupytext>=1.16.0",
    "jupyter>=1.1.1",
    "pandas>=2.2.3",
    "plotly[express]>=6.0.1",
    "polars>=1.27.1",
    "pyarrow>=19.0.1",
    "pydantic>=2.12.5",
    "python-dotenv[cli]>=1.1.0",
    "qrcode[pil]>=8.1",
    "google-genai>=1.61.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "types-requests>=2.32.4.20260107",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
