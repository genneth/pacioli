[project]
name = "pacioli"
version = "0.1.0"
description = "Personal finance tracker using Open Banking APIs and AI-powered transaction categorization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai",
    "ipython",
    "itables",
    "jupytext",
    "jupyter",
    "plotly",
    "polars",
    "pydantic",
    "python-dotenv",
    "requests",
    "tqdm",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-requests",
    "types-tqdm",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "plotly.*", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
